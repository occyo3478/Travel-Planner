<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 상세 - Travel Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body>
    <div class="detail-page-container">
        <aside class="detail-sidebar">
            <div class="detail-header">
                <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> 목록으로</a>
                <h1 id="trip-title">여행 제목</h1>
                <p id="trip-dates" class="trip-dates">2023.10.01 ~ 2023.10.05</p>
            </div>

            <div class="places-section">
                <h2>방문할 장소</h2>
                <div class="add-place-form">
                    <input type="text" id="place-input" placeholder="장소 검색 및 추가">
                    <button id="add-place-btn"><i class="fa-solid fa-plus"></i></button>
                </div>

                <div id="places-list" class="places-list">
                    <!-- Places will be added here -->
                    <div class="empty-places">
                        <p>방문할 장소를 추가해보세요!</p>
                    </div>
                </div>

                <button id="optimize-btn" class="btn-primary optimize-btn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 경로 최적화
                </button>
            </div>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script type="module" src="script.js"></script>
</body>

</html>
