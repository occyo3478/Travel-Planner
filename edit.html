<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 수정 - Travel Planner">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="add-page-header">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1>여행 계획 수정하기</h1>
    </header>

    <main class="add-page">
        <div class="add-form">
            <div class="form-group">
                <label for="destination">여행지</label>
                <input type="text" id="destination" placeholder="예: 파리, 제주도">
            </div>

            <div class="form-group">
                <label for="start-date">출발일</label>
                <input type="date" id="start-date">
            </div>

            <div class="form-group">
                <label for="end-date">종료일</label>
                <input type="date" id="end-date">
            </div>

            <div class="form-group">
                <label for="activity">여행 일정</label>
                <input type="text" id="activity" placeholder="예: 에펠탑 방문, 맛집 투어">
            </div>

            <button id="edit-btn" class="btn-primary" type="button">
                <i class="fa-solid fa-check"></i>
                수정 내용 저장하기
            </button>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDqAZiiw7SKc4SLSsWug1G3e-f5-u-pkYw",
            authDomain: "travel-planner-a9d51.firebaseapp.com",
            projectId: "travel-planner-a9d51",
            storageBucket: "travel-planner-a9d51.firebasestorage.app",
            messagingSenderId: "966221614343",
            appId: "1:966221614343:web:f48783ed75140a8be589a2",
            measurementId: "G-6RSREEXYS4"
        };

        firebase.initializeApp(firebaseConfig);
        window.db = firebase.firestore();
    </script>

    <script src="script.js"></script>
</body>
</html>
